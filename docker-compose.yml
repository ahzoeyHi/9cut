version: '3.8'

services:
  9cut:
    image: crpi-umndlxo5qzmbd6ji.cn-beijing.personal.cr.aliyuncs.com/ahzoey/ai-spoken:latest
    container_name: 9cut-app
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      # 可选：如需直接访问后端 API，取消下行注释并在 .env 中配置 BACKEND_PORT
      # - "${BACKEND_PORT:-3000}:3000"
    volumes:
      # 数据持久化
      - 9cut-uploads:/app/server/uploads
      - 9cut-generated:/app/server/generated
      - 9cut-data:/app/server/data
    env_file:
      - .env
    environment:
      - DATABASE_PATH=./data/database.sqlite
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  9cut-uploads:
    driver: local
  9cut-generated:
    driver: local
  9cut-data:
    driver: local
