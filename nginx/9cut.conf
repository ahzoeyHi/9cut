# 9Cut 口播视频自动生成系统 - Nginx 配置

server {
    listen 80;
    server_name localhost;

    # 可选：配置域名
    # server_name 9cut.example.com;

    # 日志配置
    access_log /var/log/nginx/9cut_access.log;
    error_log /var/log/nginx/9cut_error.log;

    # 前端静态资源
    location / {
        root /var/www/9cut/dist;
        try_files $uri $uri/ /index.html;

        # 静态资源缓存配置
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # HTML文件不缓存
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # API代理
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # AI服务可能需要较长时间，设置超时
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 大文件上传支持
        client_max_body_size 100M;
    }

    # 生成资源访问
    location /generated/ {
        alias /var/www/9cut/server/generated/;
        expires 1d;
        add_header Cache-Control "public";

        # 支持视频流式播放
        location ~* \.(mp4|webm|ogg)$ {
            mp4;
            mp4_buffer_size 1M;
            mp4_max_buffer_size 5M;
        }
    }

    # 上传资源访问
    location /uploads/ {
        alias /var/www/9cut/server/uploads/;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
}

